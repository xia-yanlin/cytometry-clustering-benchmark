name: Analysis checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python style and syntax
        run: |
          ruff format --check analysis posthoc experiments
          ruff check analysis posthoc experiments
          python -m compileall -q analysis posthoc experiments
      - name: Rebuild figures and tables
        run: |
          python analysis/scripts/build_main_figure_data.py
          python analysis/scripts/render_main_figures.py
          python analysis/scripts/render_supplement_figures.py
          python analysis/scripts/build_tables.py
      - name: Rebuild post hoc analyses
        run: |
          python posthoc/scripts/matching_sensitivity.py --source posthoc/source --out posthoc/output
          python posthoc/scripts/objective_selection.py --source posthoc/source --out posthoc/output

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Check R syntax
        shell: Rscript {0}
        run: |
          files <- list.files(
            "experiments/src",
            pattern = "\\.R$",
            recursive = TRUE,
            full.names = TRUE
          )
          stopifnot(length(files) > 0)
          invisible(lapply(files, parse))
