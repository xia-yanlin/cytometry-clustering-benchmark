name: Analysis checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python style and syntax
        run: |
          ruff format --check analysis posthoc experiments tools
          ruff check analysis posthoc experiments tools
          python -m compileall -q analysis posthoc experiments tools
          python tools/reproduce.py verify-release
          ! git grep -nP '[\p{Han}]' -- '*.py' '*.R'
      - name: Rebuild figures and tables
        run: python tools/reproduce.py paper
      - name: Rebuild post hoc analyses
        run: python tools/reproduce.py posthoc

  r-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Check R syntax
        shell: Rscript {0}
        run: |
          files <- list.files(
            "experiments/src",
            pattern = "\\.R$",
            recursive = TRUE,
            full.names = TRUE
          )
          stopifnot(length(files) == 9)
          invisible(lapply(files, parse))
